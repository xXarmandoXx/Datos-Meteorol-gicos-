<html lang="es">
<head>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clima Mando">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. VARIABLES Y RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-body: #121212; 
            --bg-sidebar: #0a0a0a;
            --glass-bg: rgba(25, 25, 25, 0.6); 
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --accent-blue: #38bdf8;
            --accent-blue-dark: #0ea5e9;
            --accent-pink: #f472b6;   
            --accent-orange: #fb923c; 
            --accent-green: #34d399;
            --accent-purple: #c084fc; 
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-disabled: #475569; 
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.03) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(244, 114, 182, 0.03) 0%, transparent 25%);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* --- 2. SIDEBAR INTERACTIVO --- */
        .sidebar { width: 80px; background: var(--bg-sidebar); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 100; transition: width 0.3s; }
        .sidebar:hover { width: 220px; align-items: flex-start; padding: 20px; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        
        .brand-icon { font-size: 1.8rem; color: var(--accent-blue); filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.3)); margin-bottom: 40px; transition: var(--transition); }
        .sidebar:hover .brand-icon { margin-left: 10px; transform: scale(1.1); }
        
        .menu-items { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .menu-btn { padding: 14px; width: 100%; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: var(--transition); border: 1px solid transparent; }
        .sidebar:hover .menu-btn { justify-content: flex-start; padding-left: 15px; gap: 15px; }
        .menu-btn span { display: none; font-weight: 500; font-size: 0.95rem; white-space: nowrap; }
        .sidebar:hover .menu-btn span { display: block; }
        
        .menu-btn:hover { background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid rgba(255,255,255,0.1); transform: translateY(-2px); }
        .menu-btn.active { color: var(--accent-blue); background: rgba(56, 189, 248, 0.05); border-left: 3px solid var(--accent-blue); border-top: 1px solid transparent; border-right: 1px solid transparent; border-bottom: 1px solid transparent; }

        /* --- 3. MAIN CONTENT Y GRID --- */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 20px 30px; scroll-behavior: smooth; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-info h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(90deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Animación WiFi Starlink */
        .wifi-signal { display: flex; align-items: center; gap: 5px; margin-left: 10px; color: var(--accent-blue); font-size: 1.1rem; }
        .wifi-signal i { animation: pulse-wifi 2s infinite; }
        @keyframes pulse-wifi { 0%,100% { opacity: 1; filter: drop-shadow(0 0 5px var(--accent-blue)); } 50% { opacity: 0.4; filter: none; } }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(150px, auto);
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .widget {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: var(--transition);
        }
        .widget:hover { border-color: rgba(255,255,255,0.15); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }

        /* Tamaños de Grid Ajustados */
        .w-map { grid-column: span 8; grid-row: span 2; padding: 0; border: none; }
        .w-status { grid-column: span 4; grid-row: span 2; }
        .w-rain { grid-column: span 6; grid-row: span 1; }
        .w-summary { grid-column: span 3; grid-row: span 1; }
        .w-gauge { grid-column: span 3; grid-row: span 1; align-items: center; justify-content: space-between; }
        .w-search { grid-column: span 12; grid-row: span 1; }
        .w-mini { grid-column: span 3; grid-row: span 1; }

        .widget-inactive { opacity: 0.5; background: rgba(10, 10, 10, 0.4); border: 1px dashed var(--glass-border); filter: grayscale(100%); cursor: not-allowed; }
        .widget-inactive:hover { opacity: 0.7; transform: none; box-shadow: none; }
        .badge-na { background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 6px; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* --- 4. COMPONENTES Y ANIMACIONES --- */
        .widget-header { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        
        #station-map { width: 100%; height: 100%; border-radius: 20px; z-index: 1; }
        
        .big-value { font-size: 4rem; font-weight: 800; display: flex; align-items: baseline; justify-content: center; gap: 5px; color: white; transition: color 0.5s ease; }
        .big-value .unit { font-size: 1.5rem; color: var(--text-muted); font-weight: 400; }

        .hum-bar-wrap { width: 80%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-top: 5px; overflow: hidden; }
        .hum-bar { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--accent-blue-dark), var(--accent-blue)); transition: width 1s ease; }

        .fa-stack { width: 3em; height: 3em; line-height: 3em; }
        @keyframes pulse-sun { 0%, 100% { filter: drop-shadow(0 0 15px #fbbf24); transform: scale(1); } 50% { filter: drop-shadow(0 0 30px #fbbf24); transform: scale(1.05); } }

        /* Grid de 4 Lluvias */
        .rain-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; width: 100%; height: 100%; align-items: center; }
        .rain-box { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(255,255,255,0.02); border-radius: 12px; padding: 10px 0; border: 1px solid rgba(255,255,255,0.02); }
        .rain-box .big-value { font-size: 2.2rem; }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; box-shadow: 0 0 10px var(--accent-green); } 50% { opacity: 0.4; box-shadow: 0 0 2px var(--accent-green); } 100% { opacity: 1; box-shadow: 0 0 10px var(--accent-green); } }

        /* --- ESTILOS DE BÚSQUEDA POR DÍA --- */
        .search-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .btn-quick-date { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 7px 14px; border-radius: 10px; font-family: 'Outfit'; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn-quick-date:hover, .btn-quick-date.active { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border-color: var(--accent-blue); }
        .date-picker-custom { background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); color: white; padding: 6px 14px; border-radius: 10px; font-family: 'Outfit'; font-size: 0.9rem; font-weight: 500; outline: none; color-scheme: dark; cursor: pointer; transition: var(--transition); }
        .date-picker-custom:hover, .date-picker-custom:focus { border-color: var(--accent-blue); background: rgba(255,255,255,0.1); box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
        
        .search-results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 10px; }
        .search-card { background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 18px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; justify-content: space-between; transition: var(--transition); }
        .search-card:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-2px); }
        .search-card-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .search-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.95rem; }
        .search-stat-row:last-child { border-bottom: none; padding-bottom: 0; }
        .rain-pills { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
        .rain-pill { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px 10px; text-align: center; }

        /* --- 5. TABLA Y EXPORTACIÓN --- */
        .view-section { display: none; animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; margin-top: 15px; }
        th { text-align: left; padding: 12px; color: var(--text-muted); border-bottom: 2px solid var(--glass-border); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text-main); transition: var(--transition); }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: skeleton-shimmer 1.5s infinite; border-radius: 8px; height: 20px; width: 80%; margin: 0 auto; }
        @keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .dropdown-wrapper { position: relative; display: inline-block; }
        .btn-action { background: linear-gradient(135deg, var(--accent-blue), #2563eb); border: none; padding: 10px 20px; border-radius: 10px; color: white; font-family: 'Outfit'; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: var(--transition); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }
